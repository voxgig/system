# CI for @voxgig/system: compile and run the suite with its coverage gate.
#
# ACTIVE. Runs on every push and pull request. ci/README.md has the notes,
# including why the build step is load-bearing.

name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: install
        run: npm install --no-audit --no-fund

      # MUST run before the tests. The suite executes compiled output from
      # dist-test/; without a build, `npm test` reports "0 tests, 100%
      # coverage" and exits 0 - green, and completely meaningless.
      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.lcov
          if-no-files-found: warn
